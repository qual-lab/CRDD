name: Standard Change Proposal / 標準変更提案
description: Propose a change to CRDD rules, authorities, phase contracts, audits, templates, or conformance. / CRDDのRule、Authority、工程、Audit等の変更を提案します。
title: "[Standard Change / 標準変更] "
labels: ["type:standard-change"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        A proposal is a Change Candidate, not an adopted CRDD rule. Qual-Lab makes the final classification and adoption decision through CRDD Maintenance. Normative and Breaking changes require Evidence, impact review, alternatives, audits, and Migration consideration. If you cannot complete an analysis field, state what is unknown; maintainers may enrich it during triage.
        提案はChange Candidateであり、採用済みCRDD Ruleではありません。最終的な分類と採用はQual-LabがCRDD Maintenanceを通じて判断します。不明な項目は推測で埋めず、不明と記載してください。

  - type: textarea
    id: problem
    attributes:
      label: Current problem / 現在の問題
      description: What cannot be handled reliably, and who is affected? / 現行CRDDで安定して扱えないことと影響対象を示してください。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Actual event or Evidence / 実際の事象またはEvidence
      description: Describe checkable events, repeated failures, findings, external authority, or reproduction, with CRDD version and limitations. / 確認可能な事象、再発、Finding、外部Authority、再現、CRDD Version、Limitを示してください。
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Affected documents / 影響文書・Authority
      description: Identify likely canonical documents, Property Authorities, phase contracts, audits, templates, or conformance criteria. Uncertain items may be marked as such. / 影響候補を示し、不明なものは不明と記載できます。
      placeholder: "01_Principles.md; 27_Architecture.md; PL-xx; agent.* adapter"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed result / 提案する結果
      description: Explain the behavior, responsibility, or outcome that should change, not wording alone. / 文言だけでなく、変更後に成立させたい挙動、責務、結果を示してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 検討した代替案
      description: Compare meaningful alternatives, including keeping the current rule, and explain trade-offs. / 現状維持を含む意味のある代替案とTrade-offを比較してください。
    validations:
      required: true

  - type: textarea
    id: adopter_impact
    attributes:
      label: Existing adopter impact / 既存採用者への影響
      description: What changes for repositories, artifacts, agents, skills, tools, workflows, conformance claims, or training? / 既存Repository、Artifact、Agent、Skill、Tool、Workflow、準拠、教育への影響を示してください。
    validations:
      required: true

  - type: dropdown
    id: migration
    attributes:
      label: Migration need / Migrationの必要性
      description: Breaking impact requires explicit Migration consideration, including in v0.x. / v0.xでもBreaking ImpactではMigration検討が必要です。
      options:
        - Migration is likely required / 必要になる可能性が高い
        - Migration may be conditionally required / 条件により必要
        - No Migration is expected, with rationale below / 不要と考える理由を下記へ記載
        - Unsure / 不明
    validations:
      required: true

  - type: textarea
    id: migration_detail
    attributes:
      label: Migration detail / Migration・互換性
      description: Describe required or conditional actions, compatibility risks, or why no Migration is expected. / 必須・条件付きAction、互換性Risk、不要と考える理由を示してください。
    validations:
      required: true

  - type: textarea
    id: uncertainty
    attributes:
      label: Uncertainty and conditions / 不確実性・判断条件
      description: What Evidence is missing, what are the limits, and what would change the recommendation? / 不足Evidence、Limit、Recommendationが変わる条件を示してください。
    validations:
      required: false
